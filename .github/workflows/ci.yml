name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: ruff check src tests bench examples
      - run: python -m pytest -q
      - run: python bench/evaluate.py
      - name: examples are up to date
        run: python examples/generate.py && git diff --exit-code examples
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t onboarding-mapper .
      - run: docker run --rm --entrypoint python onboarding-mapper -m pytest -q
